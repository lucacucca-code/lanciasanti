<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e293b" />
  <title>Santini 3D - Lancio del Giorno</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Georgia', serif;
      background: #0f172a;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }
    .header-info {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-info h1 {
      font-size: 1.05rem;
      color: #fbbf24;
      letter-spacing: 0.5px;
    }
    .header-info p {
      font-size: 0.82rem;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .counter-badge {
      background: #d97706;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .env-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .env-selector::-webkit-scrollbar { display: none; }
    .env-btn {
      background: rgba(15, 23, 42, 0.75);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }
    .env-btn.active {
      background: #fbbf24;
      color: #0f172a;
      font-weight: 700;
      border-color: #fbbf24;
    }
    .bottom-hint {
      text-align: center;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .hint-pill {
      background: rgba(15, 23, 42, 0.75);
      color: #f1f5f9;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
    }
    #reset-btn {
      display: none;
      background: #fbbf24;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="header-info">
        <div>
          <h1 id="date-title">Santi del Giorno</h1>
          <p id="current-saint-sub">Scorri verso l'alto per lanciare il santino</p>
        </div>
        <div class="counter-badge" id="card-counter">0 / 0</div>
      </div>

      <div class="env-selector" id="env-selector">
        <button class="env-btn active" data-env="montagna">🏔️ Cima Montagna</button>
        <button class="env-btn" data-env="grattacielo">🏙️ Tetto Grattacielo</button>
        <button class="env-btn" data-env="scogliera">🌊 Scogliera</button>
        <button class="env-btn" data-env="sanpietro">⛪ Piazza San Pietro</button>
      </div>
    </div>

    <div class="bottom-hint">
      <button id="reset-btn">Ricarica il mazzo dei Santi</button>
      <div class="hint-pill" id="hint-text">👆 Trascina e lancia il santino come un frisbee!</div>
    </div>
  </div>


  <!-- Database Santi -->
  <script src="santi.js"></script>
  <!-- Logica 3D e Fisica -->
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW non registrato:', err));
      });
    }
  </script>
</body>
</html>
